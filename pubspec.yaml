name: lxmusic_app
description: 个人自用的 LX 音源音乐播放器（酷狗搜索 + 自定义源解析 + 在线播放）
publish_to: 'none'
version: 1.2.1+4

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  dio: ^5.4.0
  just_audio: ^0.9.36
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  webview_flutter: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/lx/
