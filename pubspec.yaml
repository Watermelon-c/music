name: lxmusic_app
description: 个人自用的 LX 音源音乐播放器（酷狗搜索 + 自定义源解析 + 在线播放）
publish_to: 'none'
version: 1.3.0+7

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  dio: ^5.4.0
  just_audio: ^0.9.36
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  webview_flutter: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/lx/

# 应用图标生成配置
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
