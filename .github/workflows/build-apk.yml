name: build-apk

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

env:
  # 配了 KEYSTORE_BASE64 就用固定签名，没配就退回 debug 签名（仍能构建）
  KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

jobs:
  build:
    name: 构建 APK
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: 自动递增 versionCode
        run: |
          BASE=$(grep -m1 '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d'+' -f1)
          sed -i "s/^version: .*/version: ${BASE}+${{ github.run_number }}/" pubspec.yaml
          grep '^version:' pubspec.yaml

      - name: 生成 Android 平台文件
        run: |
          flutter --version
          flutter create --platforms=android --org com.yezi --project-name music /tmp/scaffold
          rm -rf android
          cp -r /tmp/scaffold/android ./android
          ls android/app/src/main

      - name: 打补丁（清单 + 签名配置）
        run: |
          python3 tools/patch_manifest.py android/app/src/main/AndroidManifest.xml
          python3 tools/patch_gradle.py android/app/build.gradle

      - name: 写入签名密钥
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/yezi.jks
          {
            echo "storeFile=yezi.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
          ls -l android/app/yezi.jks android/key.properties

      - name: 拉取依赖
        run: flutter pub get

      - name: 生成应用图标
        run: dart run flutter_launcher_icons

      - name: 静态检查（不阻断构建，仅用于排查）
        continue-on-error: true
        run: flutter analyze

      - name: 构建 release APK
        run: flutter build apk --release

      - name: 校验签名
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | head -10

      - name: 读取版本号
        id: ver
        run: |
          VERSION=$(grep -m1 '^version:' pubspec.yaml | cut -d' ' -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "版本: $VERSION"

      # 让 latest 这个 tag 每次都指向最新提交，下载链接保持不变
      - name: 清理旧的 latest Release
        run: gh release delete latest --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 椰子音乐 ${{ steps.ver.outputs.version }}
          make_latest: true
          body: |
            椰子音乐（个人自用）自动构建

            - 版本：${{ steps.ver.outputs.version }}
            - 提交：${{ github.sha }}
            - 构建时间：${{ github.event.head_commit.timestamp }}

            下载：`app-release.apk`（Android，允许未知来源后直接安装）

            手机下载慢的话，把下面的链接前面加上镜像前缀：

            ```
            https://gh-proxy.org/ + https://github.com/${{ github.repository }}/releases/download/latest/app-release.apk
            ```
          files: build/app/outputs/flutter-apk/app-release.apk
          fail_on_unmatched_files: true

      - name: 上传安装包（Artifacts，可选）
        uses: actions/upload-artifact@v4
        with:
          name: lx-music-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
