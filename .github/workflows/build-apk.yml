name: build-apk

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: 构建 APK
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: 生成 Android 平台文件
        run: |
          flutter --version
          flutter create --platforms=android --org com.lxmusic --project-name lxmusic_app /tmp/scaffold
          rm -rf android
          cp -r /tmp/scaffold/android ./android
          ls android/app/src/main

      - name: 打补丁（联网权限 / 允许 http / 应用名）
        run: python3 tools/patch_manifest.py android/app/src/main/AndroidManifest.xml

      - name: 拉取依赖
        run: flutter pub get

      - name: 静态检查（不阻断构建，仅用于排查）
        continue-on-error: true
        run: flutter analyze

      - name: 构建 release APK
        run: flutter build apk --release

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: lx-music-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
